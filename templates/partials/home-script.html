  <script>
    (function () {
      const siteHeader = document.getElementById("site-header");
      const primaryNav = document.getElementById("primary-nav");
      const menuToggle = document.getElementById("menu-toggle");
      const menuLabel = menuToggle.querySelector(".menu-toggle-label");
      const mobileNavQuery = window.matchMedia("(max-width: 900px)");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let menuOpen = false;

      function setMenuOpen(open, restoreFocus) {
        menuOpen = open;
        siteHeader.classList.toggle("is-open", open);
        primaryNav.classList.toggle("is-open", open);
        menuToggle.setAttribute("aria-expanded", String(open));
        menuToggle.setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");
        menuLabel.textContent = open ? "Close" : "Menu";
        primaryNav.setAttribute("aria-hidden", String(mobileNavQuery.matches && !open));
        primaryNav.inert = mobileNavQuery.matches && !open;
        document.body.classList.toggle("menu-is-open", open);
        if (open) primaryNav.querySelector("a").focus();
        else if (restoreFocus) menuToggle.focus();
      }

      setMenuOpen(false, false);
      menuToggle.addEventListener("click", function () { setMenuOpen(!menuOpen, menuOpen); });
      primaryNav.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () { if (menuOpen) setMenuOpen(false, true); });
      });
      document.addEventListener("keydown", function (event) {
        if (!menuOpen) return;
        if (event.key === "Escape") { event.preventDefault(); setMenuOpen(false, true); }
      });
      mobileNavQuery.addEventListener("change", function () {
        if (!mobileNavQuery.matches && menuOpen) setMenuOpen(false, false);
        else setMenuOpen(menuOpen, false);
      });
      siteHeader.addEventListener("focusout", function (event) {
        if (menuOpen && !siteHeader.contains(event.relatedTarget)) setMenuOpen(false, false);
      });

      const progressBar = document.getElementById("reading-progress-bar");
      const heroImage = document.querySelector(".hero-media");
      const hero = document.querySelector(".hero");
      if (!hero) siteHeader.classList.remove("is-on-hero");
      const darkSections = Array.from(document.querySelectorAll("[data-header-tone='dark']"));
      let scrollQueued = false;
      function updateScrollState() {
        const scrollable = document.documentElement.scrollHeight - window.innerHeight;
        const progress = scrollable > 0 ? Math.min(1, window.scrollY / scrollable) : 0;
        progressBar.style.transform = "scaleX(" + progress + ")";
        siteHeader.classList.toggle("is-scrolled", window.scrollY > 36);
        const headerProbe = Math.min(40, siteHeader.getBoundingClientRect().height / 2);
        const overDarkSection = darkSections.some(function (section) {
          const rect = section.getBoundingClientRect();
          return rect.top <= headerProbe && rect.bottom > headerProbe;
        });
        siteHeader.classList.toggle("is-over-dark", overDarkSection);
        if (!reducedMotion && heroImage) {
          const heroProgress = Math.max(0, Math.min(1, window.scrollY / Math.max(1, window.innerHeight)));
          const scale = 1.045 - heroProgress * 0.035;
          const shift = heroProgress * 1.3;
          heroImage.style.transform = "scale(" + scale.toFixed(3) + ") translateY(" + shift.toFixed(2) + "%)";
        }
        scrollQueued = false;
      }
      window.addEventListener("scroll", function () {
        if (!scrollQueued) { scrollQueued = true; window.requestAnimationFrame(updateScrollState); }
      }, { passive: true });
      updateScrollState();

      if ("IntersectionObserver" in window) {
        if (hero) {
          const heroObserver = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) { siteHeader.classList.toggle("is-on-hero", entry.isIntersecting && entry.intersectionRatio > 0.08); });
          }, { threshold: [0, 0.08] });
          heroObserver.observe(hero);
        }

        const sectionLinks = Array.from(primaryNav.querySelectorAll("a[href*='#']:not(.mobile-nav-cta)"));
        const sectionTargets = sectionLinks.map(function (link) {
          const targetUrl = new URL(link.href, window.location.href);
          return targetUrl.pathname === window.location.pathname && targetUrl.hash ? document.querySelector(targetUrl.hash) : false;
        }).filter(Boolean);
        const navigationObserver = new IntersectionObserver(function (entries) {
          const active = entries.filter(function (entry) { return entry.isIntersecting; }).sort(function (a, b) { return b.intersectionRatio - a.intersectionRatio; })[0];
          if (!active) return;
          sectionLinks.forEach(function (link) {
            if (new URL(link.href, window.location.href).hash === "#" + active.target.id) link.setAttribute("aria-current", "location");
            else link.removeAttribute("aria-current");
          });
        }, { rootMargin: "-18% 0px -70% 0px", threshold: [0, .25, .5, .75, 1] });
        sectionTargets.forEach(function (section) { navigationObserver.observe(section); });

        if (!reducedMotion) {
          document.body.classList.add("motion-ready");
          const revealObserver = new IntersectionObserver(function (entries, observer) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) { entry.target.classList.add("is-visible"); observer.unobserve(entry.target); }
            });
          }, { threshold: 0.12, rootMargin: "0px 0px -34px 0px" });
          document.querySelectorAll(".reveal, .reveal-line, .reveal-mask").forEach(function (item) { revealObserver.observe(item); });

        }

        const steps = Array.from(document.querySelectorAll(".process-step"));
        const total = steps.length;
        const processNumber = document.getElementById("process-current-number");
        const processTitle = document.getElementById("process-current-title");
        const processCopy = document.getElementById("process-current-copy");
        const processFill = document.getElementById("process-progress-fill");
        const processSection = document.querySelector(".homepage-process-section");
        const processFocusCopy = document.getElementById("process-focus-copy");
        if (steps.length && processSection && processNumber && processTitle && processCopy && processFill && processFocusCopy) {
          processSection.classList.add("process-enhanced");
          let activeIndex = -1;
          let transitionTimer = 0;
          const observedRatios = new Map();
          function setActiveStage(index, immediate) {
            if (index < 0 || index >= total || index === activeIndex) return;
            activeIndex = index;
            steps.forEach(function (step, stepIndex) { step.classList.toggle("is-active", stepIndex === index); });
            processNumber.textContent = String(index + 1).padStart(2, "0") + "/" + String(total).padStart(2, "0");
            processFill.style.transform = "scaleX(" + ((index + 1) / total) + ")";
            window.clearTimeout(transitionTimer);
            if (immediate || reducedMotion) {
              processTitle.textContent = steps[index].dataset.title;
              processCopy.textContent = steps[index].dataset.copy;
              processFocusCopy.classList.remove("is-switching");
              return;
            }
            processFocusCopy.classList.add("is-switching");
            transitionTimer = window.setTimeout(function () {
              processTitle.textContent = steps[index].dataset.title;
              processCopy.textContent = steps[index].dataset.copy;
              requestAnimationFrame(function () { processFocusCopy.classList.remove("is-switching"); });
            }, 175);
          }
          setActiveStage(0, true);
          const processObserver = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) { observedRatios.set(entry.target, entry.isIntersecting ? entry.intersectionRatio : 0); });
            const active = steps.map(function (step, index) { return { index: index, ratio: observedRatios.get(step) || 0 }; })
              .filter(function (item) { return item.ratio >= 0.6; })
              .sort(function (a, b) { return b.ratio - a.ratio; })[0];
            if (active) setActiveStage(active.index, false);
          }, { rootMargin: "-12% 0px -12% 0px", threshold: [0, 0.6, 0.75, 1] });
          steps.forEach(function (step) { processObserver.observe(step); });
        }
      }

      const faqItems = Array.from(document.querySelectorAll(".faq-item"));
      faqItems.forEach(function (item) {
        item.addEventListener("toggle", function () {
          if (item.open) faqItems.forEach(function (other) { if (other !== item) other.open = false; });
        });
      });
      document.getElementById("current-year").textContent = String(new Date().getFullYear());
    }());
  </script>
